name: Sonda fontes SP (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/sonda/**', 'scripts/radar/**', '.github/workflows/sonda-sp.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/radar/radar.mjs 2>&1 | tee radar.log
        env: { RADAR_TESTE: 'true', RADAR_FONTES: 'doe-sp,querido-sp', RADAR_DIAS: '365', RADAR_GATILHO: 'push' }
      - if: always()
        run: |
          rm -rf sp-sondas && mkdir -p sp-sondas && cp -r radar-saida sp-sondas/saida || true; cp radar.log sp-sondas/ || true
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add sp-sondas && git commit -m "sonda SP: respostas" && git pull --no-rebase --no-edit && git push
