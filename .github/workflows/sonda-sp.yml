name: Sonda fontes SP (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/sonda/**', '.github/workflows/sonda-sp.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/sonda/sp.mjs
      - if: always()
        run: |
          true
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add sp-sondas && git commit -m "sonda SP: respostas" && git pull --no-rebase --no-edit && git push
