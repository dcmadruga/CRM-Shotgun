name: Sonda fontes PR (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/sonda/**', 'scripts/radar/**', '.github/workflows/sonda-pr.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/radar/radar.mjs
        env: { RADAR_TESTE: 'true', RADAR_FONTES: 'dioe-pr,querido-pr', RADAR_DIAS: '365', RADAR_GATILHO: 'push' }
      - run: mkdir -p pr-sondas && rm -rf pr-sondas/saida && cp -r radar-saida pr-sondas/saida
        if: always()
      - if: always()
        run: |
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add pr-sondas && git commit -m "sonda PR: respostas" && git pull --no-rebase --no-edit && git push
