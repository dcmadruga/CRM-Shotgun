name: Sonda fontes SC (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/sonda/**', '.github/workflows/sonda-sc.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/radar/radar.mjs
        env: { RADAR_TESTE: 'true', RADAR_FONTES: 'sinfat-sc,dom-sc,querido-sc', RADAR_DIAS: '365', RADAR_GATILHO: 'push' }
      - run: mkdir -p sc-sondas && rm -rf sc-sondas/saida && cp -r radar-saida sc-sondas/saida
      - run: |
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add sc-sondas && git commit -m "sonda SC: respostas" && git pull --no-rebase --no-edit && git push
