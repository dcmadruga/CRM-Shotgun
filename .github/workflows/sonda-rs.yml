name: Sonda RS (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/radar/**', 'scripts/sonda/**', '.github/workflows/sonda-rs.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: mkdir -p rs-sondas && node scripts/radar/radar.mjs > rs-sondas/ms-radar.txt 2>&1; tail -c 60000 rs-sondas/ms-radar.txt
        env:
          RADAR_TESTE: 'true'
          RADAR_DIAS: '365'
          RADAR_FONTES: 'doe-ms,dom-ms,querido-ms'
          RADAR_AMOSTRA_LOG: '1'
      - if: always()
        run: mkdir -p rs-sondas/saida && cp radar-saida/*.json rs-sondas/saida/ || true
      - if: always()
        run: |
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add rs-sondas && git commit -m "sonda RS: respostas" && git pull --no-rebase --no-edit && git push
