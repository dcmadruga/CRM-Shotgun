name: Sonda fontes SE PA TO RO (temporária)
on:
  push:
    branches: [claude/project-thread-wpu830]
    paths: ['scripts/sonda/**', '.github/workflows/sonda-n.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Teste real de 12 meses dos 4 Estados
        env:
          RADAR_TESTE: 'true'
          RADAR_GATILHO: 'push'
          RADAR_DIAS: '365'
          RADAR_FONTES: 'simlam-pa,famep,querido-pa,dom-se,querido-se,querido-to,arom,querido-ro'
        run: node scripts/radar/radar.mjs 2>&1 | tee radar-log.txt
      - if: always()
        run: |
          rm -rf n-sondas/saida; mkdir -p n-sondas/saida; cp -r radar-saida/* n-sondas/saida/ 2>/dev/null; cp radar-log.txt n-sondas/saida/log.txt
          git config user.name "sonda-bot"; git config user.email "sonda-bot@users.noreply.github.com"
          git add n-sondas && git commit -m "sonda N: respostas" && git pull --no-rebase --no-edit && git push
