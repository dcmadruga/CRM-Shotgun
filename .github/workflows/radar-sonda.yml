name: Radar - sonda das fontes (temporária)
# Só roda na branch de desenvolvimento do Radar; será removida antes do merge.
on:
  push:
    branches: ['claude/project-thread-wpu830']
    paths: ['scripts/radar-sonda.mjs', '.github/workflows/radar-sonda.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Baixar amostras
        run: node scripts/radar-sonda.mjs
      - name: Gravar amostras na branch de desenvolvimento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add radar-amostras && git commit -q -m "Radar: amostras para desenvolvimento (temporário)" && git push -q origin HEAD:${GITHUB_REF_NAME}
