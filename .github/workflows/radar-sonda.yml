name: Radar - sonda das fontes (temporária)
# Só roda na branch de desenvolvimento do Radar; será removida antes do merge.
on:
  push:
    branches: ['claude/project-thread-wpu830']
    paths: ['scripts/radar-sonda.mjs', '.github/workflows/radar-sonda.yml']
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Testar fontes
        env:
          ALVOS: >-
            https://www.iomat.mt.gov.br/busca/busca/buscar/query/0/di:2026-10-21/df:2026-11-21/?1=1&q=%22posto%20de%20combust%C3%ADvel%22
            https://iomat.mt.gov.br/apifront/portal/edicoes/edicoes_from_data/2026-11-19.json?&subtheme=false
            https://amm.diariomunicipal.org/publicacoes/?q=%22posto+de+combust%C3%ADvel%22
            https://amm.diariomunicipal.org/publicacao/1943972/
            https://monitoramento.sema.mt.gov.br/simlam/ListarProcessoPublico.aspx
            https://monitoramento.sema.mt.gov.br/simlam/
            https://pnla2.mma.gov.br/pnla/pesquisa-licenciamentos/
            https://protocolo.seplag.mt.gov.br/consulta/cp.php
            https://queridodiario.ok.org.br/api/gazettes?territory_ids=5103403&querystring=posto&size=2
        run: node scripts/radar-sonda.mjs
