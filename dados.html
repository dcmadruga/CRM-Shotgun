<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dados complementares Argo</title>
<meta name="theme-color" content="#17180f">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f2f6; --surface:#ffffff; --fg:#1d1a22; --muted:#6b6475; --line:#e3dfe8;
  --ink:#17180f; --ink-fg:#f6f4f8; --accent:#cb2da0; --purple:#7030a0; --field:#fbfafc; --danger:#b42335;
  --display:"Poppins",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141218; --surface:#1d1a23; --fg:#ece8f1; --muted:#a39bb0; --line:#322d3a;
  --ink:#0b0b08; --accent:#e04bb5; --purple:#a874d6; --field:#17151c; --danger:#f0697a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1d1a23; --fg:#ece8f1; --muted:#a39bb0; --line:#322d3a;
  --ink:#0b0b08; --accent:#e04bb5; --purple:#a874d6; --field:#17151c; --danger:#f0697a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--ink);color:var(--ink-fg)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:16px;padding-top:max(16px,env(safe-area-inset-top,0px))}
header img{width:44px;height:44px}
header h1{font-family:var(--display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
header p{margin:0;font-size:13px;opacity:.75}
main{display:flex;flex-direction:column;gap:18px;padding-block:20px 40px}
.intro{margin:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sec>h2{margin:0;background:var(--accent);color:#fff;font-family:var(--display);font-weight:500;font-size:13.5px;letter-spacing:.03em;padding:8px 14px}
.body{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.full{grid-column:1/-1}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.prev figure{margin:0;display:grid;gap:3px;justify-items:start}.prev figcaption{font-size:11.5px;color:var(--muted)}.prev img{max-height:140px;max-width:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
.cfclink{font-size:12.5px;color:var(--purple,#7030a0);font-weight:600;margin-top:4px;text-decoration:none}.cfclink:hover{text-decoration:underline}.cfchint{font-size:11.5px;color:var(--muted)}
.nsug{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}.nsug small{color:var(--muted);font-size:12px}.nsug button{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;width:auto}
@media (min-width:700px){.body>label:has(.busca){grid-column:span 2}}
.linha{grid-column:1/-1;display:grid;grid-template-columns:minmax(160px,1fr) 3fr;gap:12px;align-items:start}
.linha .deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.linha .deps:not(:has(> :not([hidden]))){display:none}
@media (max-width:640px){.linha{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
label b{color:var(--danger);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
input[readonly]{opacity:.8}
.bad{border-color:var(--danger)}
.badf .hint{color:var(--danger)}
.files{font-weight:500}
.anxl{display:grid;gap:8px;margin-top:-4px}.anxl:empty{display:none}
.anxi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);display:grid;gap:6px}
.anxi .anxn{display:flex;gap:8px;align-items:center;font-size:13px;word-break:break-all}.anxi .anxn span{flex:1}
.anxi .anxn button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}.anxi .anxn button:hover{color:var(--danger)}
.anxi .anxs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.anxi .anxs input{max-width:220px}
.anxi .cst{font-size:12.5px;color:var(--muted)}.anxi .cst.ok{color:#2f9e5b}.anxi .cst.bad{color:var(--danger)}
.anxi.grande{border-color:var(--danger)}
.outro{margin-top:6px}
label.mesmo{flex-direction:row;align-items:center;gap:8px;margin-top:6px;font-size:14px;font-weight:500;color:var(--fg);letter-spacing:0;cursor:pointer}
label.mesmo input{width:auto;margin:0}
.cnpjrow{display:flex;gap:8px}
.cnpjrow input{flex:1}
button.busca{padding:8px 14px;font-size:14px;background:var(--surface);color:var(--purple);flex:none}
button.busca:disabled{opacity:.6;cursor:progress}
.err{color:var(--danger);font-size:12px;font-weight:500;min-height:0}
.radios{display:flex;gap:16px;padding-top:6px;font-size:15px;font-weight:500;color:var(--fg)}
.radios label{flex-direction:row;align-items:center;gap:6px;font-size:15px;color:var(--fg)}
.radios input{width:auto}
button{font:inherit;font-weight:600;border-radius:4px;padding:12px 18px;border:1px solid var(--purple);background:var(--purple);color:#fff;font-size:16px;cursor:pointer}
.send{display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);font-size:13px;margin:0}
#msg{font-weight:500}
.done{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:6px;padding:14px}
#csStatus{display:flex;align-items:center;gap:8px}
#csStatus.ok{color:var(--fg)}
#csStatus.bad{color:var(--danger)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.socios{display:flex;flex-direction:column;gap:8px}
.socios>p{margin:0;font-size:14px;font-weight:600;color:var(--fg)}
label.socio{flex-direction:row;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--field);cursor:pointer;color:var(--fg);font-size:14px;font-weight:400;letter-spacing:0}
label.socio:has(input:checked){border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
label.socio input{width:auto;margin-top:3px;flex:none}
label.socio b{font-size:15px;font-weight:600;color:var(--fg)}
label.socio small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--purple)}to{box-shadow:0 0 0 0 transparent}}
</style>
</head><body>
<header><div class="wrap">
  <img src="icons/icon-192.png" alt="Argo">
  <div><h1 id="titulo">Dados complementares obrigatórios</h1><p id="sub">Argo Sistemas · implantação do sistema</p></div>
</div></header>

<div class="wrap"><main>
  <p class="intro" id="intro"></p>
  <p id="carregando" class="hint">Carregando o formulário…</p>

  <form id="f" novalidate hidden>
  <div style="display:flex;flex-direction:column;gap:18px">
  <section class="sec" id="secContrato" hidden><h2>Contrato social</h2><div class="body">
    <label class="full"><span>Contrato social (com a última alteração) <b>*</b></span><input type="file" name="contratoSocial" data-v="arquivo" accept="application/pdf,image/*" multiple required><span class="hint">Envie o PDF ou fotos de todas as páginas. Vamos ler o documento aqui mesmo no seu aparelho para encontrar os sócios e já preencher os dados do representante legal.</span><span class="files hint"></span></label>
    <p id="csStatus" class="full hint" role="status" hidden></p>
    <div id="csSocios" class="full socios" hidden></div>
  </div></section>
  <div id="secoes" style="display:flex;flex-direction:column;gap:18px"></div>
  <div class="send">
    <button type="submit" id="btnEnviar">Enviar pelo WhatsApp</button>
    <p id="msg" role="status" class="err"></p>
    <p class="hint" id="destHint"></p>
  </div>
  </div>
  </form>

  <div class="done" id="done" hidden>
    <span id="finalTxt"></span> Se o WhatsApp não abriu, <a id="waLink" href="#" target="_blank" rel="noopener">toque aqui</a>.
  </div>
</main></div>

<script src="firebase-config.js"></script>
<script src="etapa2-padrao.js"></script>
<script src="contrato-social.js"></script>
<script src="lib/municipios.js" defer></script>
<script>
const $=s=>document.querySelector(s);
const f=$('#f');
const DRAFT='argo-dados-cliente-v1';
const dig=v=>String(v||'').replace(/\D/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Dados vindos do link: #d=base64url(JSON) com cnpj, razão, cidade, vendedor, WhatsApp do vendedor e nº da proposta */
let L={};
// Preenchimento pelo vendedor (botão na Etapa 2): salva no sistema sem abrir o WhatsApp
const VEND=/(^|[#&])vend=1(&|$)/.test(location.hash);
try{ const m=location.hash.match(/d=([^&]+)/); if(m){ const b=m[1].replace(/-/g,'+').replace(/_/g,'/'); L=JSON.parse(decodeURIComponent(escape(atob(b)))) } }catch(e){ L={} }
const destino = dig(L.w);
if(L.v) $('#sub').textContent='Argo Sistemas · '+(L.n?'proposta nº '+L.n+' · ':'')+'consultor: '+L.v;
$('#destHint').textContent = destino ? 'Os dados vão para o WhatsApp do seu consultor'+(L.v?' ('+L.v+')':'')+'.' : 'Os dados serão enviados pelo WhatsApp.';
if(VEND) $('#destHint').textContent='Os dados ficam salvos direto na proposta.';

/* Configuração publicada pelo administrador (Firestore, leitura pública) */
async function carregarConfig(){
  const C=window.FIREBASE_CONFIG||{};
  if(C.apiKey && C.projectId){
    try{
      const r=await fetch(`https://firestore.googleapis.com/v1/projects/${C.projectId}/databases/(default)/documents/publico/etapa2?key=${C.apiKey}`);
      if(r.ok){ const j=await r.json(); const t=j.fields&&j.fields.json&&j.fields.json.stringValue; if(t){ const cfg=JSON.parse(t); try{ localStorage.setItem('argo-etapa2-cfg',t) }catch(e){} return cfg } }
    }catch(e){}
    try{ const t=localStorage.getItem('argo-etapa2-cfg'); if(t) return JSON.parse(t) }catch(e){}
  }
  return window.ETAPA2_PADRAO;
}

let CFG=null, CAMPOS=[];
const ehOutro=v=>/^outr[oa]s?(\b|$)/i.test(String(v||'').trim());
function valoresFinais(o){ const r={...o}; Object.keys(r).filter(k=>k.endsWith('__outro')).forEach(k=>{ const base=k.slice(0,-7); if(ehOutro(r[base]) && r[k]) r[base]=r[base]+': '+r[k]; delete r[k] }); return r }
const MAXF=10*1024*1024;
const arqs=el=>!el?[]:(el._lista||[...(el.files||[])]);
const TIPO_ATTR={
  texto:'', email:'type="email" autocomplete="email"', telefone:'inputmode="tel" autocomplete="tel"', cpf:'inputmode="numeric"', rg:'autocomplete="off" style="text-transform:uppercase"',
  cnpj:'inputmode="numeric" placeholder="00.000.000/0000-00"', cep:'inputmode="numeric"', numero:'type="number" min="0" inputmode="numeric"', data:'type="date"'
};
function campoHtml(c){
  const req=c.req?' required':'', star=c.req?' <b>*</b>':'', full=(c.full||c.tipo==='textolongo')?' class="full"':'';
  const lab=`<span>${esc(c.label)}${star}</span>`;
  if(c.tipo==='simnao') return `<label${full}>${lab}<span class="radios"><label><input type="radio" name="${esc(c.k)}" value="Sim"${req}> Sim</label><label><input type="radio" name="${esc(c.k)}" value="Não"> Não</label></span></label>`;
  if(c.tipo==='opcoes'){ const ops=String(c.opcoes||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
    if(c.outros && !ops.some(ehOutro)) ops.push('Outros');
    return `<label${full}>${lab}<select name="${esc(c.k)}"${req}><option value="">Escolha</option>${ops.map(o=>`<option>${esc(o)}</option>`).join('')}</select><input name="${esc(c.k)}__outro" class="outro" data-v="texto" placeholder="Qual? Informe aqui" aria-label="${esc(c.label)}: qual?" hidden></label>` }
  if(c.tipo==='arquivo') return `<label class="full">${lab}<input type="file" name="${esc(c.k)}" data-v="arquivo" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.xml,.zip,.rar,.pfx,.p12,.cer,.crt,.p7b,.pem,application/x-pkcs12"${req}><span class="hint">${esc(c.ph||'Fotos, PDF ou documentos. Até 10 MB por arquivo.')}</span><span class="files hint"></span></label>`;
  if(c.tipo==='textolongo') return `<label class="full">${lab}<textarea name="${esc(c.k)}"${req}${c.ph?` placeholder="${esc(c.ph)}"`:''}></textarea></label>`;
  const extra=c.k==='uf'?' maxlength="2" style="text-transform:uppercase"':'';
  if(c.tipo==='cnpj') return `<label${full}>${lab}<span class="cnpjrow"><input name="${esc(c.k)}" data-v="cnpj" ${TIPO_ATTR.cnpj}${req}><button type="button" class="busca" data-busca="${esc(c.k)}">Pesquisar</button></span><span class="hint cnpjmsg" hidden></span></label>`;
  return `<label${full}>${lab}<input name="${esc(c.k)}" data-v="${esc(c.tipo)}" ${TIPO_ATTR[c.tipo]||''}${req}${c.ph?` placeholder="${esc(c.ph)}"`:''}${extra}></label>`;
}
function montar(){
  $('#titulo').textContent=CFG.titulo||'Dados complementares obrigatórios';
  document.title=(CFG.titulo||'Dados complementares')+' Argo';
  $('#intro').innerHTML=esc(CFG.intro||'')+' Os campos com <b style="color:var(--danger)">*</b> são obrigatórios.';
  $('#finalTxt').textContent=CFG.final||'Pronto! O WhatsApp abriu com os seus dados. Confira e toque em enviar.';
  CAMPOS=[];
  const cs=CFG.contratoSocial!==false; $('#secContrato').hidden=!cs; f.elements.contratoSocial.disabled=!cs; f.elements.contratoSocial.required=cs;
  if(cs) CAMPOS.push({k:'contratoSocial', label:'Contrato social', tipo:'arquivo', req:true, secao:'Contrato social'});
  $('#secoes').innerHTML=(CFG.secoes||[]).map(s=>{
    const cs=(s.campos||[]).filter(c=>(c.show!==false||c.fixo) && !(CFG.contratoSocial!==false && c.tipo==='arquivo' && /contrato social/i.test(c.label||''))); if(!cs.length) return '';
    cs.forEach(c=>CAMPOS.push({...c, secao:s.titulo}));
    // Sim/Não que abre os campos seguintes da seção (padrão quando é o primeiro campo)
    // Cada Sim/Não que abre vira uma linha: a pergunta à esquerda e os campos dela ao lado, até o próximo Sim/Não que abre
    const html=[]; let grupo=null, grupoK='', deps=[];
    const fecha=()=>{ if(grupo){ html.push(`<div class="linha">${grupo}<div class="deps">${deps.join('')}</div></div>`); grupo=null; deps=[] } };
    cs.forEach((c,i)=>{
      const abre=c.tipo==='simnao' && (c.abre!=null ? c.abre : i===0) && i<cs.length-1;
      let h=campoHtml(c);
      if(abre){ fecha(); grupo=h.replace(/^<label/,`<label data-abre="${esc(c.k)}"`); grupoK=c.k; return }
      if(c.solto) fecha();
      if(grupo){ deps.push(h.replace(/^<label/,`<label data-dep="${esc(grupoK)}"`)); return }
      html.push(h);
    });
    fecha();
    return `<section class="sec"><h2>${esc(s.titulo)}</h2><div class="body">${html.join('')}</div></section>`;
  }).join('');
}
const tem=k=>!!f.elements[k];

/* Rascunho */
function lerForm(){ const o={}; new FormData(f).forEach((v,k)=>{ if(typeof v==='string') o[k]=v.trim() }); return o }
function preencher(o){ Object.entries(o||{}).forEach(([k,v])=>{ const els=f.elements[k]; if(!els||v==null||v==='') return;
  if(els instanceof RadioNodeList && els[0] && els[0].type==='radio'){ els.forEach(r=>r.checked=(r.value===v)) } else if(!els.value) els.value=v }) }

/* Validações */
const fmtCnpj=v=>dig(v).replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/,'$1.$2.$3/$4-$5');
function cnpjOk(v){ const d=dig(v); if(d.length!==14||/^(\d)\1+$/.test(d)) return false;
  const c=n=>{ let s=0,w=n-7; for(let i=0;i<n;i++){ s+=+d[i]*w--; if(w<2) w=9 } const r=s%11; return r<2?0:11-r }; return c(12)===+d[12]&&c(13)===+d[13] }
function cpfOk(v){ const d=dig(v); if(d.length!==11||/^(\d)\1+$/.test(d)) return false;
  const c=n=>{ let s=0; for(let i=0;i<n;i++) s+=+d[i]*(n+1-i); const r=(s*10)%11; return r===10?0:r }; return c(9)===+d[9]&&c(10)===+d[10] }
function valida(el){
  if(el.type==='radio') return true;
  if(el.hidden){ el.classList.remove('bad'); return true }
  if(el.type==='file'){ const fs=arqs(el); const ok=(!el.required||fs.length>0) && fs.every(x=>x.size<=MAXF); el.closest('label').classList.toggle('badf',!ok); el.classList.toggle('bad',!ok); return ok }
  const v=el.value.trim(), t=el.dataset.v; let ok=true;
  if(el.required && !v) ok=false;
  else if(v && t==='cnpj') ok=cnpjOk(v);
  else if(v && t==='cpf') ok=cpfOk(v);
  else if(v && t==='rg') ok=/^[0-9A-Za-z]{4,16}$/.test(v.replace(/[.\-\/\s]/g,''));
  else if(v && t==='email') ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  else if(v && t==='telefone') ok=dig(v).length>=10;
  else if(v && t==='cep') ok=dig(v).length===8;
  el.classList.toggle('bad',!ok); return ok;
}

/* Preenchimento automático pelo CNPJ e CEP */
const buscados={};
// Sugestões de nome (sócios do CNPJ) abaixo de um campo; um clique preenche e o campo continua livre
const nomeBonito=n=>String(n||'').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(D[aeo]s?|E)\s/g,m=>m.toLowerCase());
function sugerirNomes(lab, inp, nomes){
  let box=lab.querySelector('.nsug'); if(box) box.remove(); if(!nomes.length) return;
  box=document.createElement('span'); box.className='nsug';
  box.innerHTML='<small>Sócios:</small>'+nomes.slice(0,6).map(n=>`<button type="button">${esc(nomeBonito(n))}</button>`).join('');
  box.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); inp.value=b.textContent; inp.dispatchEvent(new Event('input',{bubbles:true})); if(inp.classList.contains('bad')) valida(inp); inp.focus() });
  lab.appendChild(box);
}
// Consulta o CNPJ em mais de uma base (se uma estiver fora do ar, usa a outra). A inscrição estadual vem do CNPJ.ws.
const tempo=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const pegaJson=u=>tempo(fetch(u),9000).then(r=>{ if(r.status===404||r.status===400) return {naoAchou:true}; if(!r.ok) throw new Error('HTTP '+r.status); return r.json() });
// Inscrição estadual (só o CNPJ.ws traz). A base pública limita a 3 consultas por minuto e às vezes dá erro 500: tenta de novo em segundo plano.
function ieDe(W,uf){ const ies=(W&&W.estabelecimento&&W.estabelecimento.inscricoes_estaduais)||[]; const ie=ies.find(x=>x.ativo&&x.estado&&x.estado.sigla===uf)||ies.find(x=>x.ativo)||ies.find(x=>x.estado&&x.estado.sigla===uf); return ie?ie.inscricao_estadual:'' }
async function pegaIe(d,uf,vivo){
  for(const espera of [4000,15000,30000,60000]){
    await new Promise(r=>setTimeout(r,espera)); if(!vivo()) return null;
    try{ const r=await tempo(fetch('https://publica.cnpj.ws/cnpj/'+d),12000); if(r.status===404) return ''; if(!r.ok) continue; return ieDe(await r.json(),uf) }catch(_){}
  }
  return null;
}
async function consultarCnpj(d){
  const [ba,ws]=await Promise.allSettled([pegaJson('https://brasilapi.com.br/api/cnpj/v1/'+d), pegaJson('https://publica.cnpj.ws/cnpj/'+d)]);
  const B=ba.status==='fulfilled'&&!ba.value.naoAchou?ba.value:null, W=ws.status==='fulfilled'&&!ws.value.naoAchou?ws.value:null;
  let base=B;

let forgeP=null;
function carregarForge(){ return forgeP||(forgeP=new Promise((ok,erro)=>{ if(window.forge) return ok(window.forge); const sc=document.createElement('script'); sc.src='lib/forge.min.js'; sc.onload=()=>ok(window.forge); sc.onerror=()=>{ forgeP=null; erro(new Error('forge')) }; document.head.appendChild(sc) })) }
// Abre o certificado com a senha: se a senha não confere, o arquivo não abre (a assinatura MAC falha)
async function validarCert(file,senha){
  const forge=await carregarForge(); const buf=new Uint8Array(await file.arrayBuffer()); let bin=''; for(let i=0;i<buf.length;i+=8192) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));

    const p12=forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin),false,senha);
    const bags=(p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag]||[]).map(b=>b.cert).filter(Boolean);
    const c=bags.find(c=>!c.extensions||!c.extensions.some(e=>e.name==='basicConstraints'&&e.cA))||bags[0];
    return {ok:true, cn:c&&((c.subject.getField('CN')||{}).value||''), ate:c&&c.validity.notAfter};
  }catch(e){ return /MAC|password|Invalid/i.test(e.message||'')?{ok:false}:{ok:false, erro:'Arquivo de certificado inválido ou corrompido.'} }
}

// Campo "Senha do certificado" dos Parâmetros: a senha agora é pedida em cada certificado; o campo fica oculto e recebe as senhas

    csStatus(SOCIOS.length ? (SOCIOS.length===1?'Encontramos 1 sócio no contrato. ':'Encontramos '+SOCIOS.length+' sócios no contrato. ')+(SOCIOS.length===1?'Os dados já foram preenchidos no Responsável legal. Confira.':'Escolha quem é o representante legal.')
      : 'Não conseguimos identificar os sócios neste arquivo'+(r.ocr?' (a imagem pode estar pouco nítida)':'')+'. O arquivo será enviado mesmo assim. Preencha os dados do representante legal abaixo.', SOCIOS.length?'ok':'bad');

// "Praça dos Motoristas, 59, Poção, Cuiabá-MT" -> logradouro, número, complemento, bairro, cidade, UF
// Cidades do IBGE (lib/municipios.js) e estados por extenso, para reconhecer cidade e UF no endereço do contrato
const nz=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const ESTADOS={'acre':'AC','alagoas':'AL','amapa':'AP','amazonas':'AM','bahia':'BA','ceara':'CE','distrito federal':'DF','espirito santo':'ES','goias':'GO','maranhao':'MA','mato grosso':'MT','mato grosso do sul':'MS','minas gerais':'MG','para':'PA','paraiba':'PB','parana':'PR','pernambuco':'PE','piaui':'PI','rio de janeiro':'RJ','rio grande do norte':'RN','rio grande do sul':'RS','rondonia':'RO','roraima':'RR','santa catarina':'SC','sao paulo':'SP','sergipe':'SE','tocantins':'TO'};
const SIGLAS=new Set(Object.values(ESTADOS));
let CID=null;
function cidades(){
  if(CID||!window.MUNICIPIOS) return CID; CID=new Map();
  for(const [uf,lista] of Object.entries(window.MUNICIPIOS)) lista.split('|').forEach(n=>{ const k=nz(n); if(!CID.has(k)) CID.set(k,[]); CID.get(k).push({n,uf}) });
  return CID;
}
function ufDe(t){ const k=nz(t).replace(/^(estado|uf)( d[eoa])?\s*/,''); if(ESTADOS[k]) return ESTADOS[k]; const s=k.toUpperCase(); return SIGLAS.has(s)?s:'' }
// Procura a cidade no IBGE; com a UF conhecida, prefere a da mesma UF
function acharCidade(t,uf){ const C=cidades(); if(!C) return null; const l=C.get(nz(t)); if(!l) return null; return l.find(x=>x.uf===uf)||(l.length===1||!uf?l[0]:null) }
function partesEndereco(e){
  const r={}; const cap=x=>/[a-zà-ú]/.test(x)?x:x.toLowerCase().replace(/(^|[\s\/(-])(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(D[aeo]s?|E|De)\s/g,m=>m.toLowerCase());
  // tira conectivos do contrato: "na Rua...", "e Comarca de...", "Estado de Mato Grosso"
  let ps=String(e||'').split(/,|;/).map(x=>x.trim().replace(/^(?:e\s+)?(?:n[oa]s?|em|à|ao)\s+/i,'').replace(/\.$/,'').trim()).filter(Boolean); if(!ps.length) return r;
  const tira=(re)=>{ const i=ps.findIndex(x=>re.test(x)); if(i<0) return null; const v=ps[i]; ps.splice(i,1); return v };
  const PREF_CID=/^(?:e\s+)?(?:(?:cidade|munic[ií]pio|comarca|distrito)(?:\s+e\s+(?:cidade|munic[ií]pio|comarca|distrito))*)\s*(?:de|do|da|:)?\s*/i;
  let v;
  if((v=tira(/^(estado|uf)\b/i))) r.uf=ufDe(v)||v.replace(/^(estado|uf)\s*(de|do|da|:)?\s*/i,'').slice(0,2).toUpperCase();
  else { const i=ps.findIndex((x,j)=>j>0&&ESTADOS[nz(x)]); if(i>0){ r.uf=ESTADOS[nz(ps[i])]; ps.splice(i,1) } }
  if((v=tira(/^(?:e\s+)?(munic[ií]pio|cidade|comarca|distrito)\b/i))){ const m=v.replace(PREF_CID,'').match(/^(.+?)(?:\s*[-\/–]\s*([A-Za-z]{2}))?\.?$/); r.cidade=m[1]; if(m[2]&&!r.uf) r.uf=m[2].toUpperCase() }
  else { const ult=ps[ps.length-1].match(/^(.+?)\s*[-\/–]\s*([A-Za-z]{2})\.?$/);
    if(ult&&SIGLAS.has(ult[2].toUpperCase())){ r.cidade=ult[1]; r.uf=r.uf||ult[2].toUpperCase(); ps.pop() }
    else if(ps.length>1 && /^[A-Za-z]{2}\.?$/.test(ps[ps.length-1])&&SIGLAS.has(ps[ps.length-1].replace('.','').toUpperCase())){ r.uf=r.uf||ps.pop().replace('.','').toUpperCase(); r.cidade=ps.pop() } }
  // Sem cidade identificada: procura entre as partes (menos a primeira, que é a rua) uma cidade que exista no IBGE
  if(!r.cidade && cidades()){ for(let i=ps.length-1;i>0;i--){ const c=acharCidade(ps[i],r.uf); if(c){ r.cidade=c.n; ps.splice(i,1); break } } }
  // Confere a cidade no IBGE: usa o nome oficial e, se o estado não veio ou não bate, traz o estado de lá
  if(r.cidade){ const c=acharCidade(r.cidade,r.uf)||acharCidade(r.cidade,''); if(c){ r.cidade=c.n; if(!r.uf||!(cidades().get(nz(c.n))||[]).some(x=>x.uf===r.uf)) r.uf=c.uf } }
  if((v=tira(/^bairro\b/i))) r.bairro=v.replace(/^bairro\s*:?\s*/i,'');
  if((v=tira(/^(complemento|sala|apto|apartamento|ap\.|bloco|casa|lote|quadra|qd\.?|lt\.?)\b/i))) r.complemento=v.replace(/^complemento\s*:?\s*/i,'');
  r.logradouro=(ps.shift()||'').replace(/^(endere[cç]o|logradouro)\s*:?\s*/i,'');
  if((v=tira(/^(n[uú]mero|n[º°o.]*)?\s*:?\s*(\d+[A-Za-z]?|s\/?n)\b/i))) r.numero=v.replace(/^(n[uú]mero|n[º°o.]*)\s*:?\s*/i,'');
  else { const m=r.logradouro.match(/^(.*?)[\s,]+(?:n[uú]mero|n[º°o.]*)?\s*(\d+[A-Za-z]?)$/i); if(m){ r.logradouro=m[1]; r.numero=m[2] } }
  if(!r.bairro && ps.length){ const bi=ps.findIndex(x=>/^(b\.|jardim|jd\.?|vila|parque|residencial|centro|setor)/i.test(x)); r.bairro=ps.splice(bi>=0?bi:ps.length-1,1)[0] }
  if(ps.length) r.complemento=[r.complemento,...ps].filter(Boolean).join(', ');
  ['logradouro','bairro','cidade','complemento'].forEach(k=>{ if(r[k]) r[k]=cap(r[k].trim()) });
  return r;
}
function escolher(v,rolar=true){
  const sec=secResp(); if(!sec) return;
  const s=v==='outro'?null:SOCIOS[+v];
  const val=(c)=>{
    if(!s) return '';
    const l=String(c.label||'').toLowerCase();
    if(c.tipo==='cpf') return fmtCpf(s.cpf);
    if(c.tipo==='rg'||/\brg\b|identidade|\bcnh\b/.test(l)) return s.rg?(s.rg+(s.orgaoRg&&c.tipo!=='rg'?' '+s.orgaoRg:'')):(s.cnh&&/cnh|habilita/.test(l)?'CNH '+s.cnh:'');
    if(c.tipo==='data') return /nasc/.test(l)&&s.nascimento?s.nascimento.split('/').reverse().join('-'):'';
    if(c.tipo==='email'||c.tipo==='telefone'||c.tipo==='arquivo') return '';
    if(c.tipo==='cep') return s.cep||'';
    if(/estado civil/.test(l)) return s.estadoCivil||'';
    if(/nacionalidade/.test(l)) return s.nacionalidade||'';
    if(/profiss/.test(l)) return s.profissao||'';
    if(/cargo|fun[cç][aã]o|qualifica/.test(l)) return s.administrador?'Sócio administrador':'Sócio';
    if(/n[uú]mero|^n[º°o]\.?$/.test(l)) return END.numero||'';
    if(/complemento/.test(l)) return END.complemento||'';
    if(/bairro/.test(l)) return END.bairro||'';
    if(/cidade|munic/.test(l)) return END.cidade||'';
    if(/^(estado|uf)\b/.test(l)&&!/civil/.test(l)) return END.uf||'';
    if(/\bcep\b/.test(l)) return s.cep||'';
    if(/endere|resid|logradouro/.test(l)) return separado?(END.logradouro||s.endereco||''):[s.endereco,s.cep&&'CEP '+s.cep].filter(Boolean).join(', ');
    if(/nome/.test(l)) return s.nome;
    return '';
  };
  const labs=(sec.campos||[]).map(c=>String(c.label||'').toLowerCase());
  const separado=labs.some(l=>/bairro|cidade|n[uú]mero/.test(l));
  const END=s?partesEndereco(s.endereco):{};
  let alvo=null;
  (sec.campos||[]).forEach(c=>{
    const el=f.elements[c.k]; if(!el||el instanceof RadioNodeList) return;
    let v=val(c);
    if(el.tagName==='SELECT'){
      if(!v){ if(s) return; el.value=''; return }
      const n=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().slice(0,5);
      const op=[...el.options].find(o=>o.value&&n(o.value)===n(v)); if(op) el.value=op.value; else return;
    } else {
      if(!s){ if(/nome|cpf|rg|identidade|estado civil|nacionalidade|profiss|cargo|endere|nasc/.test(String(c.label).toLowerCase())||['cpf','rg'].includes(c.tipo)) el.value=''; return }
      if(!v) return; el.value=v;
    }
    alvo=alvo||el; if(el.classList.contains('bad')) valida(el);
  });
  f.dispatchEvent(new Event('input'));
  const secEl=[...document.querySelectorAll('#secoes .sec')].find(x=>x.querySelector('h2')?.textContent===sec.titulo);
  if(rolar && secEl){ secEl.scrollIntoView({behavior:'smooth',block:'start'}); secEl.classList.remove('flash'); void secEl.offsetWidth; secEl.classList.add('flash');
    const vazio=[...secEl.querySelectorAll('input,select,textarea')].find(x=>!x.value&&x.required); setTimeout(()=>(vazio||alvo)?.focus({preventScroll:true}),450) }
}

const fmtData=iso=>{ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y };
function montarTexto(o){
  const linhas=['*'+(CFG.titulo||'Dados complementares obrigatórios')+' - Argo*'];
  if(L.n) linhas.push('Proposta nº '+L.n);
  let sec=null;
  CAMPOS.forEach(c=>{
    let v=o[c.k];
    if(c.tipo==='arquivo'){ const el=f.elements[c.k]; const fs=el&&!el.disabled?arqs(el):[]; if(!fs.length) return; v=fs.map(x=>x.name).join(', ')+(L.p?' (anexado no sistema)':'') }
    if(!v) return;
    if(c.tipo==='data') v=fmtData(v);
    if(c.k==='uf') v=v.toUpperCase();
    if(c.secao!==sec){ linhas.push('','*'+c.secao+'*'); sec=c.secao }
    linhas.push(c.label+': '+v);
    if(c.k==='contratoSocial' && SOCIOS.length) linhas.push('Sócios no contrato: '+SOCIOS.map(x=>x.nome+(x.administrador?' (administrador)':'')).join('; '));
  });
  return linhas.join('\n');
}

let FS=null;
async function firestore(){
  if(FS) return FS;
  const C=window.FIREBASE_CONFIG||{}; if(!C.apiKey) throw new Error('sem configuração');
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp},F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
  FS={F, db:F.getFirestore(initializeApp(C))}; return FS;
}
function lerB64(blob){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=err; r.readAsDataURL(blob) }) }
async function comprimir(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size<400*1024) return {blob:file, nome:file.name, tipo:file.type};
  try{
    const img=await createImageBitmap(file); const m=Math.min(1,1800/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*m); cv.height=Math.round(img.height*m);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    if(blob && blob.size<file.size) return {blob, nome:file.name.replace(/\.(png|webp|jpe?g)$/i,'')+'.jpg', tipo:'image/jpeg'};
  }catch(e){}
  return {blob:file, nome:file.name, tipo:file.type};
}
async function salvarNoSistema(o, texto){
  const {F,db}=await firestore();
  const pref=['propostas',L.p];
  const anexos=[];
  const arquivos=CAMPOS.filter(c=>c.tipo==='arquivo'&&!f.elements[c.k]?.disabled).flatMap(c=>arqs(f.elements[c.k]).map(file=>({c,file})));
  let n=0;
  for(const {c,file} of arquivos){
    n++; $('#msg').textContent=`Enviando anexo ${n} de ${arquivos.length}…`;
    const z=await comprimir(file); const b64=await lerB64(z.blob);
    // Logo: nome padrão CNPJ_RAZÃO_Logo (mesma regra dos anexos da implantação)
    if(/logo/i.test(c.label||'')){ const ext=(String(z.nome).match(/\.[^.]+$/)||[''])[0]; const lp=x=>String(x||'').replace(/[\\/:*?"<>|]+/g,'-').trim(); z.nome=[String(o.cnpj||'').replace(/\D/g,''), o.razao].map(lp).filter(Boolean).concat('Logo').join('_')+ext; }
    const ref=F.doc(F.collection(db,...pref,'anexos')); const PART=700000, partes=Math.ceil(b64.length/PART);
    for(let i=0;i<partes;i++) await F.setDoc(F.doc(db,...pref,'anexos',ref.id,'partes',String(i).padStart(3,'0')),{d:b64.slice(i*PART,(i+1)*PART)});
    await F.setDoc(ref,{nome:z.nome, tipo:z.tipo||'application/octet-stream', tamanho:z.blob.size, campo:c.label, partes, em:F.serverTimestamp()});
    anexos.push({id:ref.id, nome:z.nome, campo:c.label});
  }
  $('#msg').textContent='Salvando os dados…';
  const campos={}, valores={}; CAMPOS.forEach(c=>{ if(c.tipo!=='arquivo' && o[c.k]){ campos[c.label]=o[c.k]; valores[c.k]=o[c.k] } });
  const socios=SOCIOS.map(({nome,cpf,rg,orgaoRg,estadoCivil,profissao,nacionalidade,endereco,cep,nascimento,administrador,quotas})=>Object.fromEntries(Object.entries({nome,cpf,rg,orgaoRg,estadoCivil,profissao,nacionalidade,endereco,cep,nascimento,administrador,quotas}).filter(([k,v])=>v!=null&&v!=='')));
  if(socios.length) campos['Sócios no contrato social']=socios.map(x=>x.nome).join('; ');
  await F.setDoc(F.doc(db,...pref,'etapa2','resposta'),{campos, valores, texto, anexos, socios, em:F.serverTimestamp()});
  await F.updateDoc(F.doc(db,...pref),{e2Em:F.serverTimestamp(), e2Anexos:anexos.length});
}
